name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Lint, format check, typecheck, tests, and the package build — the same
      # gate as a local `npm run check`, so green here means publishable.
      - run: npm run check
