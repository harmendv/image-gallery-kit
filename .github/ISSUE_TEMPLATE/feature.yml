name: Feature
description: New functionality
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Package
        - Docs
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be possible, and why?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Background, links, design notes.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
    validations:
      required: true
